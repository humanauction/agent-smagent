name: SMAGE Multi-Platform Build (SEA, Node 24)

on:
    push:
        branches: [main]
    pull_request:

jobs:
    macos-arm64:
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Install postject
              run: npm install postject

            - name: Generate SEA blob
              run: node --experimental-sea-config sea-config.json

            - name: Copy Node binary
              run: cp "$(which node)" smage-macos-arm64

            - name: Inject SEA blob into Node binary
              run: npx postject smage-macos-arm64 NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: smage-macos-arm64
                  path: smage-macos-arm64

    linux-x64:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Install postject
              run: npm install postject

            - name: Generate SEA blob
              run: node --experimental-sea-config sea-config.json

            - name: Copy Node binary
              run: cp "$(which node)" smage-linux-x64

            - name: Inject SEA blob into Node binary
              run: npx postject smage-linux-x64 NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: smage-linux-x64
                  path: smage-linux-x64

    windows-x64:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Install postject
              run: npm install postject

            - name: Generate SEA blob
              run: node --experimental-sea-config sea-config.json

            - name: Copy Node binary
              run: copy "%NODE_EXE%" smage-windows-x64.exe
              env:
                  NODE_EXE: ${{ env.NODE_EXE }}

            - name: Inject SEA blob into Node binary
              run: npx postject smage-windows-x64.exe NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: smage-windows-x64
                  path: smage-windows-x64.exe
