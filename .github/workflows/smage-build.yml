name: SMAGE Multi-Platform Build (SEA, Node 24)

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        strategy:
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                include:
                    - os: macos-latest
                      exe_name: smage-macos-arm64
                      copy_cmd: cp "$(which node)" smage-macos-arm64
                      inject_cmd: npx postject smage-macos-arm64 NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

                    - os: ubuntu-latest
                      exe_name: smage-linux-x64
                      copy_cmd: cp "$(which node)" smage-linux-x64
                      inject_cmd: npx postject smage-linux-x64 NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

                    - os: windows-latest
                      exe_name: smage-windows-x64.exe
                      copy_cmd: copy "%NODE_EXE%" smage-windows-x64.exe
                      inject_cmd: npx postject smage-windows-x64.exe NODE_SEA_BLOB smage.blob --sentinel-fuse NODE_SEA_FUSE

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Build project
              run: npm run build

            - name: Convert dist JS → MJS
              if: matrix.os != 'windows-latest'
              run: find dist -type f -name "*.js" -exec bash -c 'mv "$1" "${1%.js}.mjs"' _ {} \;

            - name: Convert dist JS → MJS (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  for /r dist %f in (*.js) do (
                    ren "%f" "%~nf.mjs"
                  )

            - name: Generate SEA blob
              run: node --experimental-sea-config sea-config.json

            - name: Copy Node binary
              run: ${{ matrix.copy_cmd }}
              env:
                  NODE_EXE: ${{ env.NODE_EXE }}

            - name: Inject SEA blob
              run: ${{ matrix.inject_cmd }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.exe_name }}
                  path: ${{ matrix.exe_name }}
