name: SMAGE Multi-Platform Build (Bun, Node 24)

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                include:
                    - os: ubuntu-latest
                      exe_name: smage-linux
                    - os: macos-latest
                      exe_name: smage-macos
                    - os: windows-latest
                      exe_name: smage-windows.exe

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install Bun
              run: |
                  curl -fsSL https://bun.sh/install | bash
              shell: bash

            - name: Add Bun to PATH
              run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
              shell: bash

            - name: Install dependencies
              run: npm install

            - name: Build TypeScript
              run: npx tsc

            - name: Build SMAGE binary with Bun
              run: bun build ha_cli/main.ts --compile --outfile ${{ matrix.exe_name }}

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.exe_name }}
                  path: ${{ matrix.exe_name }}
