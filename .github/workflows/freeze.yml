name: SMAGE Freeze Approval

on:
    pull_request:
        branches: [main]

jobs:
    freeze-approval:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Build TypeScript
              run: npx tsc

            # 1. Generate baseline benchmark
            - name: Generate baseline benchmark
              run: npx vitest --run tests/freeze/freezeBenchmark.test.ts

            # 2. Generate candidate baseline
            - name: Generate candidate baseline
              run: |
                  cp tests/_freeze_bench/freeze_benchmark.json \
                     tests/_freeze_bench/freeze_benchmark_candidate.json

            # 3. Run candidate delta reporter
            - name: Run candidate delta reporter
              run: npx vitest --run tests/freeze/freezeDeltaCandidate.test.ts

            # 4. Fail PR if deltas exist
            - name: Check candidate deltas
              run: |
                  deltas=$(cat tests/_freeze_delta/freeze_delta_report.json)
                  if [ "$deltas" != "[]" ]; then
                    echo "PROBLEM - Freeze baseline changed — approval required."
                    echo "Deltas:"
                    echo "$deltas"
                    exit 1
                  fi
                  echo "✔ No deltas — baseline stable."
