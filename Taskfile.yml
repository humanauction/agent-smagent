version: "3"
# ============================================================
# SMAGE Taskfile — Command Menu
# ============================================================
# Core Commands
#   task help            → Show all available tasks
#   task list            → Alias for help
# Python Environment
#   task vvup            → Update Python requirements
# Node / TypeScript
#   task in              → Install Node packages
#   task up              → Update Node packages
#   task clean           → Remove dist/ build output
#   task bd              → Build TypeScript → dist/
#   task rebuild         → Clean + build
# Tests (compiled JS)
#   task tst             → Run all JS tests
# Provider / Router Checks
#   task provider:check  → Verify provider adapters + router wiring
# Runtime Servers (compiled JS)
#   task proxy           → Start SMAGE proxy server
#   task mcp             → Start MCP server
#   task agent           → Run agent wrapper test
#   task learn           → Run learning engine
# Dev Mode (TS directly)
#   task dev:proxy       → Start proxy server via ts-node
#   task dev:mcp         → Start MCP server via ts-node
#   task dev:agent       → Run agent wrapper test via ts-node
# Full System
#   task chk             → Full system check (build + test + learn + proxy)
# Documentation
#   task docs            → Generate SMAGE documentation
#   task docsite         → Generate SMAGE HTML documentation
# ============================================================

tasks:
    help:
        desc: "Show all available tasks"
        cmds:
            - echo "Available tasks:"
            - task --list

    list:
        desc: "Alias for help"
        cmds:
            - task help

    tree:
        desc: "Generate project file tree"
        cmds:
            - bash scripts/treeGen
            - echo "Project file tree generated in project-tree.txt"

    # -----------------------------
    # Python environment management
    # -----------------------------
    vvup:
        desc: "Update Python requirements"
        cmds:
            - pip install -r requirements.txt
            - pip freeze > requirements.txt

    # -----------------------------
    # Node / TypeScript
    # -----------------------------
    in:
        desc: "Install Node packages"
        cmds:
            - arch -arm64 npm install

    up:
        desc: "Update Node packages"
        cmds:
            - arch -arm64 npm update

    cln:
        desc: "Remove dist/ build output"
        cmds:
            - rm -rf dist

    bd:
        desc: "Build TypeScript → dist/"
        cmds:
            - arch -arm64 npx tsc

    rbd:
        desc: "Clean + build"
        cmds:
            - task cln
            - task bd

    # -----------------------------
    # Tests
    # -----------------------------
    tst:
        desc: "Run all tests (JS + TS)"
        cmds:
            - task bd
            - echo "Running compiled JS tests..."
            - arch -arm64 node dist/ha_core/transform/anchor.test.js
            - arch -arm64 node dist/ha_proxy/test-provider.js
            - arch -arm64 node dist/ha_learn/test-learn.js
            - echo "Running Vitest TS suite..."
            - arch -arm64 npx vitest --run
            - echo "Tests completed successfully"

    tst:ts:
        desc: "Run Vitest test suite (TypeScript)"
        cmds:
            - echo "Running Vitest test suite..."
            - arch -arm64 npx vitest --run

    tst:ccr:
        desc: "Run only CCRPipeline tests"
        cmds:
            - echo "Running CCRPipeline tests..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/transform/ccr.pipeline.test.ts

    tst:ccrw:
        desc: "Watch CCRPipeline tests"
        cmds:
            - arch -arm64 npx vitest --watch tests/transform/ccr.pipeline.test.ts

    tst:vw:
        desc: "Run Vitest in watch mode"
        cmds:
            - arch -arm64 npx vitest --watch

    # -----------------------------
    # Freeze Baseline + Regression
    # -----------------------------
    frzbl:
        desc: "Generate freeze baseline snapshots"
        cmds:
            - echo "Generating freeze baseline..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeBaseline.test.ts
            - echo "Freeze baseline generated in tests/_freeze"

    frztst:
        desc: "Run freeze regression tests"
        cmds:
            - echo "Running freeze regression suite..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/transform/ccrPipeline.freeze.test.ts
            - arch -arm64 npx vitest --run --reporter=verbose tests/chain/chainRouter.freeze.test.ts
            - echo "Freeze regression completed"

    frzbmrk:
        desc: "Run freeze benchmark suite"
        cmds:
            - echo "Running freeze benchmark..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeBenchmark.test.ts
            - echo "Freeze benchmark written to tests/_freeze_bench"

    # -----------------------------
    # Freeze Benchmark
    # -----------------------------
    frzbench:
        desc: "Generate freeze benchmark baseline"
        cmds:
            - echo "Generating freeze benchmark baseline..."
            - cd $(pwd) && arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeBenchmark.test.ts
            - echo "Baseline benchmark written."

    frzbench:current:
        desc: "Generate current freeze benchmark"
        cmds:
            - echo "Generating current freeze benchmark..."
            - cd $(pwd) && arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeBenchmark.test.ts
            - cp tests/_freeze_bench/freeze_benchmark.json tests/_freeze_bench/freeze_benchmark_current.json
            - echo "Current benchmark written."

    frzbench:candidate:
        desc: "Generate candidate freeze benchmark baseline"
        cmds:
            - echo "Generating candidate baseline..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeBenchmark.test.ts
            - cp tests/_freeze_bench/freeze_benchmark.json tests/_freeze_bench/freeze_benchmark_candidate.json
            - echo "Candidate baseline written."

    frzbench:open:
        desc: "Open freeze benchmark JSON"
        cmds:
            - cat tests/_freeze_bench/freeze_benchmark.json

    frzdlta:
        desc: "Run freeze delta reporter"
        cmds:
            - echo "Running freeze delta reporter..."
            - arch -arm64 npx vitest --run --reporter=verbose tests/freeze/freezeDelta.test.ts
            - echo "Freeze delta report written to tests/_freeze_delta"
            - cat tests/_freeze_delta/freeze_delta_report.json

    # -----------------------------
    # Provider / Router checks
    # -----------------------------
    provider:check:
        desc: "Check provider registry + router wiring"
        cmds:
            - arch -arm64 node dist/ha_core/call/providers/openai.js
            - arch -arm64 node dist/ha_core/call/providers/anthropic.js
            - arch -arm64 node dist/ha_core/call/providers/google.js
            - arch -arm64 node dist/ha_core/call/providers/local.js
            - arch -arm64 node dist/ha_core/call/providers/router.js
            - echo "Provider + Router modules loaded successfully"

    # -----------------------------
    # Runtime servers (compiled JS)
    # -----------------------------
    proxy:
        desc: "Start SMAGE proxy server (dist)"
        cmds:
            - "node --loader ts-node/esm ha_proxy/server.ts"

    proxy:ccr:
        desc: "Start proxy server and open CCR dashboard"
        cmds:
            - arch -arm64 node dist/ha_proxy/server.js
            - echo "Open http://localhost:8080/ccr"

    mcp:
        desc: "Start MCP server (dist)"
        cmds:
            - arch -arm64 node dist/ha_mcp/server.js

    agent:
        desc: "Run agent wrapper test (dist)"
        cmds:
            - arch -arm64 node dist/ha_cli/main.js agent

    learn:
        desc: "Run learning engine (dist)"
        cmds:
            - arch -arm64 node dist/ha_cli/main.js learn test-session

    # -----------------------------
    # Dev-mode servers (TS directly)
    # -----------------------------
    dev:proxy:
        desc: "Start proxy server using ts-node"
        cmds:
            - arch -arm64 node --require ts-node/register ha_proxy/server.ts

    dev:mcp:
        desc: "Start MCP server using ts-node"
        cmds:
            - arch -arm64 node --require ts-node/register ha_mcp/server.ts

    dev:agent:
        desc: "Run agent wrapper test using ts-node"
        cmds:
            - arch -arm64 node --require ts-node/register ha_cli/main.ts agent

    # -----------------------------
    # Full system checks
    # -----------------------------
    chk:
        desc: "Run full system check"
        cmds:
            - task rebuild
            - task tst
            - task learn
            - task proxy

    # -----------------------------
    # Documentation
    # -----------------------------
    docs:
        desc: "Generate SMAGE documentation"
        cmds:
            - arch -arm64 node dist/ha_cli/main.js docs

    docsite:
        desc: "Generate SMAGE HTML documentation"
        cmds:
            - arch -arm64 node dist/ha_cli/main.js docs:html
